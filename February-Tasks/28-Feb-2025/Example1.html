<!-- Write a 'JavaScript' program to store and print the employees data using Objects. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
</head>
<body>
    <h3>Employee Form</h3>
    <form action="">
        <div class="name">
            <label for="name">Enter Employee Name: </label>
            <input type="text" placeholder="enter name" id="name" required>
        </div> <br> <br>
        <div class="addr">
            <label for="address">Enter Employee Address: </label>
            <input type="text" placeholder="enter address" id="address" required>
        </div><br> <br>
        <div class="role">
            <label for="desig">Enter Employee Designation: </label>
            <input type="text" placeholder="enter designation" id="desig" required>
        </div><br> <br>
        <div class="salary">
            <label for="sal">Enter Employee Salary: </label>
            <input type="text" placeholder="enter salary" id="sal" required>
        </div><br> <br>
    </form>
    <button type="submit" onclick="printData()">Submit</button>
    <br> <br>
    <Output id="result"></Output>


    <script>
        document.getElementsByTagName("body")[0].style.textAlign = "center";
        function printData()
        {

            let empName = document.getElementById("name").value;
            let empAddress = document.getElementById("address").value;
            let empDesig = document.getElementById("desig").value;
            let empSalary = +document.getElementById("sal").value;

            let EmployeeDetails = {empName, empAddress, empDesig, empSalary};

            // console.log(EmployeeDetails);
            console.log("Employee Name : "+EmployeeDetails.empName+"\nEmployee Address : "+EmployeeDetails.empAddress+"\nEmployee Designation : "+EmployeeDetails.empDesig+"\nEmployee Salary : "+EmployeeDetails.empSalary);

            let result = document.getElementById("result");
            result.innerHTML = `<b>Employee Details</b><br>Employee Name : ${empName}<br>Employee Address : ${empAddress}<br>Employee Designation : ${empDesig}<br>Employee Salary : ${empSalary}<br>`;
        }
    </script>
</body>
</html>
