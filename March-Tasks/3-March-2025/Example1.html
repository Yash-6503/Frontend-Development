<!-- 
Dynamic Counter with Increment and Decrement Buttons

A counter application where users can increment, decrement, or reset the count. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
    <style>
        body{
            text-align: center;
        }
        input{
            text-align: center;
            width: 60px;
            height: 60px;
            border: 5px solid red;
            outline: none;
            border-radius: 5px 5px 5px 5px;
            font-size: 20px;
            font-weight: bold;
            color: red;
        }
        
        button{
            width: 100px;
            height: 50px;
            border: none;
            outline: none;
            /* padding: 5px 10px; */
            font-weight: bold;
            font-size: 20px;
            background: linear-gradient(red,orange);
            color: yellow;
        }

        .container{
            /* border: 2px solid black; */
            width: 220px;
            margin: 0px auto;
            gap: 0px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

       
    </style>
</head>
<body>
    <h2>Dynamic Counter</h2>
    <div class="container">
        <button onclick="decrementValue()" style="border-radius: 10px 0px 0px 10px;">-</button>
        <input type="text" id="ip" value="1" readonly>
        <button onclick="incrementValue()" style="border-radius: 0px 10px 10px 0px;">+</button>
    </div>

    <script>
        let input = document.getElementById("ip");
        
        function incrementValue(){
            let num = +input.value;
            input.value = ++num;
        }
        
        function decrementValue(){
            let num = +input.value;
            if(num > 1){
                input.value = --num;
            }
        }
    </script>
</body>
</html>
